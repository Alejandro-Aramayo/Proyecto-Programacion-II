spring.application.name=jteducation

# Conexion a la base. ${VARIABLE:valor} usa la variable de entorno si existe y, si no, el valor por defecto
# (el de la base local de cada integrante). Asi, en otra PC o en produccion se cambian la URL, el usuario y la
# contrasena sin tocar este archivo ni recompilar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jt_education_db_red}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# none: Hibernate no crea ni modifica tablas, la estructura la define bbd/Escuela_DDL.sql
spring.jpa.hibernate.ddl-auto=none
# Muestra en la consola el SQL que ejecuta Hibernate (util para encontrar errores)
spring.jpa.show-sql=true

# Sesion: si el usuario no hace nada durante 30 minutos, la sesion vence y tiene que volver a iniciarla.
# La cookie de sesion (JSESSIONID) no se puede leer desde JavaScript (http-only) y solo se envia
# a este mismo sitio (same-site), lo que dificulta el robo de la sesion.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
