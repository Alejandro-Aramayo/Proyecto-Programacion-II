<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - JTEducation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header-nav}"></header>

    <main class="container login">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresá con el email y la contraseña de tu cuenta.</p>

        <!-- Spring Security vuelve a esta página con un parámetro en la URL según lo que pasó -->
        <p th:if="${param.error}" class="mensaje error">Email o contraseña incorrectos.</p>
        <p th:if="${param.logout}" class="mensaje exito">Cerraste sesión correctamente.</p>
        <p th:if="${param.expirada}" class="mensaje info">Tu sesión expiró. Volvé a iniciar sesión.</p>

        <!-- El POST a /login lo procesa Spring Security; th:action agrega el token CSRF oculto -->
        <form class="formulario" th:action="@{/login}" method="post">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-bloque">Entrar</button>
        </form>
    </main>

    <footer th:replace="~{fragments/footer :: footer-main}"></footer>
</body>
</html>
